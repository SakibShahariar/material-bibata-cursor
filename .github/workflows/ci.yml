name: Cursor asset validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native cursor build tools
        run: |
          sudo apt-get update
          # Ubuntu 24.04 ships xcursorgen in x11-apps, not a standalone package.
          sudo apt-get install --yes librsvg2-bin x11-apps zip

      - name: Install Windows asset dependency
        run: python -m pip install --disable-pip-version-check -r requirements-win.txt

      - name: Validate Matugen hook shell syntax
        run: bash -n scripts/cursor_matugen.sh

      - name: Run builder unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate theme contrast
        run: python scripts/validate_contrast.py

      - name: Create a representative theme set
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("themes.json").read_text(encoding="utf-8"))
          selected = {name: source[name] for name in ("Peach", "Peach-Light")}
          Path(os.environ["RUNNER_TEMP"], "themes.json").write_text(
              json.dumps(selected, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Build Linux cursor formats (parallel and serial comparison)
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python scripts/build_linux.py \
            --themes Peach,Peach-Light \
            --jobs 2 \
            --themes-json "$RUNNER_TEMP/themes.json" \
            --install-dir "$RUNNER_TEMP/icons" \
            --scalable-dir "$RUNNER_TEMP/scalable"
          python scripts/build_linux.py \
            --themes Peach,Peach-Light \
            --jobs 1 \
            --themes-json "$RUNNER_TEMP/themes.json" \
            --install-dir "$RUNNER_TEMP/linux-serial/icons" \
            --scalable-dir "$RUNNER_TEMP/linux-serial/scalable"
          diff -qr "$RUNNER_TEMP/icons" "$RUNNER_TEMP/linux-serial/icons"
          diff -qr "$RUNNER_TEMP/scalable" "$RUNNER_TEMP/linux-serial/scalable"

      - name: Validate CSS cursor name resolution
        run: python scripts/validate_cursor_names.py

      - name: Build Windows cursor formats (parallel and serial comparison)
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python scripts/build_windows.py --themes Peach,Peach-Light --jobs 2 --output-dir out_win
          python scripts/build_windows.py --themes Peach,Peach-Light --jobs 1 --output-dir "$RUNNER_TEMP/windows-serial"
          diff -qr out_win "$RUNNER_TEMP/windows-serial"

      - name: Validate generated cursor assets
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python scripts/validate_theme_assets.py \
            --themes Peach,Peach-Light \
            --install-dir "$RUNNER_TEMP/icons" \
            --scalable-dir "$RUNNER_TEMP/scalable" \
            --windows-dir out_win

      - name: Smoke-test Linux release archives
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          BIBATA_MATERIAL_INSTALL_DIR: ${{ runner.temp }}/icons
          BIBATA_MATERIAL_SCALABLE_DIR: ${{ runner.temp }}/scalable
          BIBATA_MATERIAL_THEMES_JSON: ${{ runner.temp }}/themes.json
        run: bash scripts/package_release.sh ci

      - name: Smoke-test Windows release archives
        env:
          BIBATA_MATERIAL_THEMES_JSON: ${{ runner.temp }}/themes.json
        run: bash scripts/package_release.sh ci --win

      - name: Validate release archive contents
        run: |
          python scripts/validate_theme_assets.py \
            --archive dist/bibata-material-dark-ci.tar.gz \
            --archive dist/bibata-material-light-ci.tar.gz \
            --archive dist/bibata-material-dark-ci-win.zip \
            --archive dist/bibata-material-light-ci-win.zip

      - name: Smoke-test published Debian package inputs
        run: |
          bash packaging/debian/build-deb.sh v1.5.0 --output-dir "$RUNNER_TEMP/deb-published"
          package="$RUNNER_TEMP/deb-published/material-bibata-cursor_1.5.0_all.deb"
          dpkg-deb --field "$package" Package Version Architecture
          dpkg-deb --contents "$package" > "$RUNNER_TEMP/deb-published.contents"
          grep -q 'usr/share/icons/Bibata-Material-Peach/index.theme' "$RUNNER_TEMP/deb-published.contents"
          grep -q 'usr/share/doc/material-bibata-cursor/LICENSE' "$RUNNER_TEMP/deb-published.contents"
          grep -q 'usr/share/doc/material-bibata-cursor/README.md' "$RUNNER_TEMP/deb-published.contents"
          grep -q 'usr/share/doc/material-bibata-cursor/CREDITS.txt' "$RUNNER_TEMP/deb-published.contents"
          # Exercise the documented apt install/remove path on the actual
          # Ubuntu runner, preserving a pre-existing unrelated icon directory.
          sudo install -d /usr/share/icons/Unrelated
          printf 'keep me\\n' | sudo tee /usr/share/icons/Unrelated/package-test-marker >/dev/null
          sudo apt install --yes "$package"
          test -f /usr/share/icons/Bibata-Material-Peach/index.theme
          test -f /usr/share/doc/material-bibata-cursor/CREDITS.txt
          sudo apt remove --yes material-bibata-cursor
          test ! -e /usr/share/icons/Bibata-Material-Peach
          test -f /usr/share/icons/Unrelated/package-test-marker
          sudo rm -f /usr/share/icons/Unrelated/package-test-marker
          sudo rmdir /usr/share/icons/Unrelated

      - name: Smoke-test Debian package with legacy archive layout
        run: |
          # Simulate the published v1.5.0 archives, which predate bundled
          # README/LICENSE/CREDITS files. The package must source docs from
          # this checkout rather than requiring them inside release tarballs.
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          for name in ("bibata-material-dark-ci.tar.gz", "bibata-material-light-ci.tar.gz"):
              archive = Path("dist") / name
              rewritten = archive.with_suffix(".tmp.tar.gz")
              with tarfile.open(archive, "r:gz") as source, tarfile.open(rewritten, "w:gz") as target:
                  for member in source.getmembers():
                      if Path(member.name).name in {"LICENSE", "README.md", "CREDITS.txt"}:
                          continue
                      target.addfile(member, source.extractfile(member) if member.isfile() else None)
              os.replace(rewritten, archive)
          PY
          (cd dist && sha256sum bibata-material-dark-ci.tar.gz bibata-material-light-ci.tar.gz > SHA256SUMS-ci.txt)
          bash packaging/debian/build-deb.sh 1.5.0 --archive-tag ci --archives-dir dist --output-dir "$RUNNER_TEMP/deb" --expected-themes 2
          package="$RUNNER_TEMP/deb/material-bibata-cursor_1.5.0_all.deb"
          dpkg-deb --field "$package" Package Version Architecture
          dpkg-deb --contents "$package" > "$RUNNER_TEMP/deb.contents"
          grep -q 'usr/share/icons/Bibata-Material-Peach/index.theme' "$RUNNER_TEMP/deb.contents"
          grep -q 'usr/share/doc/material-bibata-cursor/LICENSE' "$RUNNER_TEMP/deb.contents"
          grep -q 'usr/share/doc/material-bibata-cursor/README.md' "$RUNNER_TEMP/deb.contents"
          grep -q 'usr/share/doc/material-bibata-cursor/CREDITS.txt' "$RUNNER_TEMP/deb.contents"
          root="$RUNNER_TEMP/deb-root"
          mkdir -p "$root/var/lib/dpkg" "$root/usr/share/icons/Unrelated"
          touch "$root/var/lib/dpkg/status"
          printf 'unrelated theme\\n' > "$root/usr/share/icons/Unrelated/marker"
          sudo dpkg --root="$root" --admindir="$root/var/lib/dpkg" --force-depends --install "$package"
          test -f "$root/usr/share/icons/Bibata-Material-Peach/index.theme"
          test -f "$root/usr/share/doc/material-bibata-cursor/CREDITS.txt"
          test -f "$root/usr/share/icons/Unrelated/marker"
          sudo dpkg --root="$root" --admindir="$root/var/lib/dpkg" --remove material-bibata-cursor
          test ! -e "$root/usr/share/icons/Bibata-Material-Peach"
          test -f "$root/usr/share/icons/Unrelated/marker"
